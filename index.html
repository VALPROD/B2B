  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0a09; /* S'adapte à la couleur de votre thème */
    }
    .iframe-container {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    iframe {
      width: 100%;
      /* Ajusté à 10px pour masquer le bandeau Google sans rogner le haut du site */
      height: calc(100% + 0px);
      position: absolute;
      top: 0px;
      left: 0;
      border: none;
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <!-- Remplacez l'adresse ci-dessous par VOTRE lien de script Google Apps Script (/exec) -->

  </div>
